<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fire Dashboard Portugal</title>

  <!-- Plotly -->
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

  <style>
    /* GLOBAL */
    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f4f4;
    }

    body { display: flex; }

    /* SIDEBAR */
    .sidebar {
      width: 250px;
      background: #1f1f1f;
      color: white;
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 8px rgba(0,0,0,0.3);
      z-index: 10;
    }

    .sidebar h2 {
      text-align: center;
      padding: 20px 10px;
      margin: 0;
      background-color: #111;
      font-size: 22px;
      border-bottom: 1px solid #333;
    }

    .nav-link {
      padding: 15px 20px;
      cursor: pointer;
      border-bottom: 1px solid #333;
      font-size: 15px;
      transition: 0.2s;
    }

    .nav-link:hover { background: #2d2d2d; }

    .nav-link.active {
      background: #FFA500;
      color: #111;
      font-weight: bold;
    }

    /* PAGES */
    .page {
      display: none;
      margin-left: 250px;
      padding: 20px 25px;
      min-height: 100vh;
      box-sizing: border-box;
      width: calc(100% - 250px);
    }
    .page.active { display: block; }

    h1 { margin-bottom: 10px; }

    /* MAIN PAGE LAYOUT B — MAPA MENOR */
    .main-layout {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 20px;
      width: 100%;
      align-items: start;
    }

    /* MAPA */
    .left-map { width: 100%; padding: 0; margin: 0; }

    #main-map {
      width: 100%;
      height: calc(100vh - 90px) !important;
    }

    /* COLUNA DIREITA */
    .right-column {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .chart-box { background: transparent; padding: 0; }

    .dual {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .small-chart { height: 240px; }

    /* DATASET */
    select {
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>🔥 Fire Dashboard</h2>
    <div class="nav-link active" data-target="main">Main Page</div>
    <div class="nav-link" data-target="dataset">Dataset</div>
  </div>

  <!-- MAIN PAGE -->
  <div id="main" class="page active">
    <h1>Main Page</h1>

    <div class="main-layout">

      <!-- MAPA -->
      <div class="left-map">
    <label><b>Select year:</b></label>
    <select id="main-year"></select>
    <div id="main-map" style="margin-top:10px;"></div>
</div>

      <!-- COLUNA DIREITA -->
      <div class="right-column">

        <div class="chart-box">
          <div id="chart-total-fires" style="height:240px;"></div>
        </div>

        <div class="dual">
          <div class="chart-box small-chart">
            <div id="chart-burned-area" style="height:220px;"></div>
          </div>

          <div class="chart-box small-chart">
            <div id="chart-causes" style="height:220px;"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- DATASET PAGE -->
  <div id="dataset" class="page">
    <h1>Dataset</h1>

    <label><b>Select year:</b></label>
    <select id="dataset-year"></select>

    <div id="dataset-table"></div>
  </div>

  <!-- SCRIPT -->
  <script>

    /* NAVIGATION */
    document.querySelectorAll(".nav-link").forEach(link => {
      link.addEventListener("click", () => {
        document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
        document.querySelectorAll(".nav-link").forEach(n => n.classList.remove("active"));
        document.getElementById(link.dataset.target).classList.add("active");
        link.classList.add("active");
      });
    });

    let dfMap = [];
    let gdfJson = null;
    let anos = [];

   async function loadData() {
  dfMap = await (await fetch("incendios_all.json")).json();
  gdfJson = await (await fetch("distritos_simplificados.geojson")).json();
  anos = [...new Set(dfMap.map(r => r.Ano))].sort((a,b)=>a-b);

  initDataset();          // seletor da página Dataset
  initMainYearSelector(); // seletor da Main Page
  updateDashboard();      // mapa + gráficos
}


/* MAPA COM HIGHLIGHT + LABELS FIXAS (2 LINHAS + PEQUENAS) */
function drawMap() {
const year = Number(document.getElementById("main-year").value);
const dataYear = dfMap.filter(r => r.Ano === year);
  // --- Soma de incêndios por distrito ---
  const sum = {};
  dataYear.forEach(r => {
    const k = r.Distrito.trim().toLowerCase(); // compatível com o GeoJSON
    sum[k] = (sum[k] || 0) + Number(r.Num_IncendiosRurais || 0);
  });

  const distritos = Object.keys(sum);
  const valores = Object.values(sum);

  // --- Centro dos distritos (calculado do teu GeoJSON) ---
  const districtCenters = {
    "évora": { lon: -7.8913, lat: 38.6611 },
    "aveiro": { lon: -8.5377, lat: 40.7318 },
    "açores": { lon: -27.4512, lat: 38.3868 },
    "beja": { lon: -7.9237, lat: 37.8624 },
    "braga": { lon: -8.2908, lat: 41.5264 },
    "bragança": { lon: -6.8475, lat: 41.5276 },
    "castelo branco": { lon: -7.6348, lat: 39.9759 },
    "coimbra": { lon: -8.2482, lat: 40.1632 },
    "faro": { lon: -8.6312, lat: 37.1857 },
    "guarda": { lon: -7.3069, lat: 40.6398 },
    "leiria": { lon: -8.7785, lat: 39.6918 },
    "lisboa": { lon: -9.3641, lat: 38.802 },
    "madeira": { lon: -16.4019, lat: 31.839 },
    "portalegre": { lon: -7.6137, lat: 39.1288 },
    "porto": { lon: -8.4172, lat: 41.2239 },
    "santarém": { lon: -8.5138, lat: 39.2212 },
    "setúbal": { lon: -8.8777, lat: 38.3332 },
    "viana do castelo": { lon: -8.4957, lat: 41.8473 },
    "vila real": { lon: -7.6618, lat: 41.5674 },
    "viseu": { lon: -7.8405, lat: 40.8409 }
  };

  // --- Função para dividir nomes longos em 2 linhas ---
  function splitName(name) {
    const words = name.split(" ");

    if (words.length === 1) {
      return name.charAt(0).toUpperCase() + name.slice(1);
    }

    if (words.length === 2) {
      return (
        words[0][0].toUpperCase() + words[0].slice(1) +
        "<br>" +
        words[1][0].toUpperCase() + words[1].slice(1)
      );
    }

    const mid = Math.ceil(words.length / 2);
    const line1 = words
      .slice(0, mid)
      .map(w => w[0].toUpperCase() + w.slice(1))
      .join(" ");

    const line2 = words
      .slice(mid)
      .map(w => w[0].toUpperCase() + w.slice(1))
      .join(" ");

    return line1 + "<br>" + line2;
  }

  // --- Arrays para labels ---
  const labelLon = [];
  const labelLat = [];
  const labelText = [];

  distritos.forEach(name => {
    const center = districtCenters[name];
    if (center) {
      labelLon.push(center.lon);
      labelLat.push(center.lat);
      labelText.push(splitName(name));
    }
  });

  // --- Base do mapa ---
  const base = {
    type: "choropleth",
    geojson: gdfJson,
    locations: distritos,
    z: valores,
    featureidkey: "properties.NAME_1",
    colorscale: "Reds",
    marker: { line: { width: 0.5, color: "#333" } },
    hoverinfo: "skip"
  };

  // --- Highlight amarelo ---
  const highlight = {
    type: "choropleth",
    geojson: gdfJson,
    locations: distritos,
    z: Array(distritos.length).fill(0),
    featureidkey: "properties.NAME_1",
    colorscale: [[0, "rgba(0,0,0,0)"], [1, "rgba(0,0,0,0)"]],
    marker: { line: { width: 0, color: "transparent" } },
    showscale: false,
    hovertemplate:
      "<b>%{location}</b><br>" +
      "Incêndios: %{customdata}<extra></extra>",
    customdata: valores
  };

  // --- Labels fixas ---
  const labels = {
    type: "scattergeo",
    lon: labelLon,
    lat: labelLat,
    text: labelText,
    mode: "text",
    textfont: {
      size: 9,
      color: "#111",
      family: "Segoe UI, Arial, sans-serif"
    },
    hoverinfo: "skip"
  };

  // --- Layout ---
  const layout = {
    geo: {
      fitbounds: "locations",
      projection: { type: "mercator" },
      showcountries: false,
      showland: true,
      landcolor: "#eeeeee",
      bgcolor: "rgba(0,0,0,0)"
    },
    margin: { t: 0, r: 0, l: 0, b: 0 }
  };

  // --- Render + eventos ---
  Plotly.newPlot("main-map", [base, highlight, labels], layout).then(gd => {

    gd.on("plotly_hover", ev => {
      const i = ev.points[0].pointIndex;

      const n = distritos.length;
      const widths = Array.from({ length: n }, (_, idx) => idx === i ? 3 : 0);
      const colors = Array.from({ length: n }, (_, idx) => idx === i ? "yellow" : "transparent");

      Plotly.restyle(gd, {
        "marker.line.width": [widths],
        "marker.line.color": [colors]
      }, [1]);
    });

    gd.on("plotly_unhover", () => {
      Plotly.restyle(gd, {
        "marker.line.width": 0,
        "marker.line.color": "transparent"
      }, [1]);
    });

  });

}


/* TOTAL FIRES */
function drawTotal() {

  const years = anos;

  const totals = years.map(y =>
    dfMap
      .filter(r => r.Ano === y)
      .reduce((a, b) => a + (+b.Num_IncendiosRurais || 0), 0)
  );

  Plotly.newPlot("chart-total-fires", [{
    x: years,
    y: totals,
    mode: "lines+markers",
    line: { color: "#0050a8", width: 2 }
  }], {
    title: { text: "Total Fires in Mainland Portugal", x: 0.02 },
    margin: { t: 50, r: 20, l: 40, b: 40 }
  });
}

    /* BURNED AREA */
    function drawBurned() {
      const year = Number(document.getElementById("main-year").value);
const dataYear = dfMap.filter(r => r.Ano === year);
      let f=0,s=0,a=0;
      dataYear.forEach(r =>{
        f+= +r.AreaArdPov_NoDistrito||0;
        s+= +r.AreaArdMato_NoDistrito||0;
        a+= +r.AreaArdAgric_NoDistrito||0;
      });

      Plotly.newPlot("chart-burned-area", [{
        x:["Forest","Scrubland","Agricultural"],
        y:[f,s,a],
        type:"bar",
        marker:{color:["#800","orange","#c9a000"]},
        width:[0.3,0.3,0.3]
      }], { 
        title: { text: "Burned Area by Fire Type", x: 0.02 },
        margin:{t:50, r:20, l:40, b:40}
      });
    }

    /* FIRE CAUSES */
    function drawCauses() {
      const year = Number(document.getElementById("main-year").value);
  const dataYear = dfMap.filter(r => r.Ano === year);

      const labels = [
        "Natural",
        "Negligent",
        "Intentional",
        "Rekindle",
        "Unknown",
        "Not Investigated"
      ];

      const totals = { n:0, ne:0, i:0, r:0, u:0, ni:0 };

      dataYear.forEach(r => {
        totals.n += Number(r.NInc_Natural) || 0;
        totals.ne += Number(r.NInc_Negligente) || 0;
        totals.i += Number(r.NInc_Intencionais) || 0;
        totals.r += Number(r.NInc_Reacendimentos) || 0;
        totals.u += Number(r.NInc_Desconhecida) || 0;
        totals.ni += Number(r.NInc_NaoInvestigados) || 0;
      });

      Plotly.newPlot("chart-causes", [{
        type: "scatterpolar",
        r: Object.values(totals),
        theta: labels,
        fill: "toself",
        line: { color: "#0050a8", width: 2 }
      }], {
        title: { text: "Fire Causes", x: 0.02 },
        margin: { t: 50, r: 10, l: 10, b: 10 },
        polar: {
          radialaxis: { visible: true, linewidth: 1 },
          angularaxis: { linewidth: 1 }
        },
        showlegend: false
      });
    }
    function initMainYearSelector() {
  const sel = document.getElementById("main-year");
  anos.forEach(a => {
    const opt = document.createElement("option");
    opt.value = a;
    opt.textContent = a;
    sel.appendChild(opt);
  });

  sel.onchange = updateDashboard;
}
function updateDashboard() {
  drawMap();
  drawTotal();
  drawBurned();
  drawCauses();
}
    /* DATASET */
    function initDataset() {
      const sel=document.getElementById("dataset-year");
      anos.forEach(a=>{
        const o=document.createElement("option");
        o.value=a;o.textContent=a;
        sel.appendChild(o);
      });
      sel.onchange=updateTable;
      updateTable();
    }

    function updateTable() {
      const y=+document.getElementById("dataset-year").value;
      const rows=dfMap.filter(r=>r.Ano===y);
      if(!rows.length)return;

      const cols=Object.keys(rows[0]);

      let html="<table><tr>"+cols.map(c => `<th>${c}</th>`).join("")+"</tr>";
      html+=rows.map(r => 
        "<tr>"+cols.map(c => `<td>${r[c]}</td>`).join("")+"</tr>"
      ).join("");
      html+="</table>";

      document.getElementById("dataset-table").innerHTML=html;
    }

    loadData();
  </script>

</body>
</html>
